[project]
name = "stripe-qb-sync"
version = "0.1.0"
description = "Turn Stripe payments into correct QuickBooks Online records automatically."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed when you swap the offline fakes for the real APIs (see README → Going live).
live = ["stripe>=10", "requests>=2.31"]

[project.scripts]
stripe-qb = "stripe_qb_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stripe_qb_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
